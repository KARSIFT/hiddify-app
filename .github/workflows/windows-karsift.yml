name: Karšift platform builds
on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Optional tag to create and publish from this commit'
        type: string
        default: ''
      reuse-android-run:
        description: 'Optional successful Android artifact run (Android sources must be unchanged)'
        type: string
        default: ''
  push:
    tags: ['v*-karsift.*']
    branches: ['codex/subscription-pool-notifications']

permissions:
  contents: read

concurrency:
  group: windows-karsift-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: '3.38.5'
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart run slang
      - run: flutter test --no-pub

  windows:
    needs: test
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: '3.38.5'
          cache: true
      - name: Download verified native core
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'hiddify-lib-windows-amd64.tar.gz'
          Invoke-WebRequest 'https://github.com/hiddify/hiddify-core/releases/download/v5.0.3/hiddify-lib-windows-amd64.tar.gz' -OutFile $archive
          $expected = '645ef71fb7e6e51cdd8b29b43c9ddea241b2324dcf441df7210d3332e39f2443'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Native core changed; review and update the pinned digest before rebuilding.'
          }
          New-Item -ItemType Directory -Path hiddify-core/bin -Force | Out-Null
          tar -xzf $archive -C hiddify-core/bin
          if ($LASTEXITCODE -ne 0) { throw 'Cannot extract native core' }
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart run slang
      - name: Build portable Windows x64
        run: flutter build windows --release --target lib/main_prod.dart --dart-define=portable=true
      - name: Package and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = 'build/windows/x64/runner/Release'
          foreach ($name in 'Hiddify.exe', 'HiddifyCli.exe', 'hiddify-core.dll', 'libcronet.dll', 'flutter_windows.dll') {
            if (-not (Test-Path (Join-Path $bundle $name))) { throw "Missing runtime file: $name" }
          }
          $version = (Select-String '^version: (.+)$' pubspec.yaml).Matches[0].Groups[1].Value.Split('+')[0]
          New-Item -ItemType Directory -Path out | Out-Null
          $zip = "Hiddify-Karsift-$version-Windows-x64-Portable.zip"
          Compress-Archive -Path "$bundle/*" -DestinationPath "out/$zip"
          $hash = (Get-FileHash "out/$zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content out/SHA256SUMS-Windows.txt -Encoding ascii
          "Native core SHA256: 645ef71fb7e6e51cdd8b29b43c9ddea241b2324dcf441df7210d3332e39f2443`nSource commit: $env:GITHUB_SHA" | Set-Content out/BUILD-INFO-Windows.txt
      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}/Inno Setup*/ISCC.exe" | Select-Object -Last 1
          if (-not $iscc) { throw 'Inno Setup is missing from this Windows runner' }
          $version = (Select-String '^version: (.+)$' pubspec.yaml).Matches[0].Groups[1].Value.Split('+')[0]
          & $iscc.FullName "/DAppVersion=$version" "/DBundleDir=$((Resolve-Path 'build/windows/x64/runner/Release').Path)" "/DReleaseDir=$((Resolve-Path out).Path)" windows/packaging/karsift.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          $installer = Get-Item "out/Hiddify-Karsift-$version-Windows-x64-Setup.exe"
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Add-Content out/SHA256SUMS-Windows.txt -Encoding ascii
      - uses: actions/upload-artifact@v6
        with:
          name: windows-installable
          path: out/*
          retention-days: 14

  android:
    if: inputs.reuse-android-run == ''
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ORG_GRADLE_PROJECT_karsiftBuild: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: '3.38.5'
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'
      - name: Download verified Android core
        run: |
          curl --fail --location --retry 3 https://github.com/hiddify/hiddify-core/releases/download/v5.0.3/hiddify-lib-android.tar.gz -o "$RUNNER_TEMP/android-core.tar.gz"
          echo "2a18ad4d9781e61901d5fb1c1edca28b8abadb9b36184055fed37091f97bc769  $RUNNER_TEMP/android-core.tar.gz" | sha256sum --check
          mkdir -p android/app/libs
          tar -xzf "$RUNNER_TEMP/android-core.tar.gz" -C android/app/libs
      - name: Prepare persistent release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KARSIFT_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KARSIFT_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          store = Path(os.environ['RUNNER_TEMP']) / 'karsift-release.p12'
          store.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          store.chmod(0o600)
          password = os.environ['KEYSTORE_PASSWORD']
          Path('android/key.properties').write_text(f'storeFile={store}\nstorePassword={password}\nkeyPassword={password}\nkeyAlias=karsift\n')
          PY
          keytool -list -keystore "$RUNNER_TEMP/karsift-release.p12" -storetype PKCS12 -storepass:env KEYSTORE_PASSWORD -alias karsift
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart run slang
      - name: Build signed Android APKs
        run: flutter build apk --release --target lib/main_prod.dart --target-platform android-arm,android-arm64,android-x64
      - name: Verify signature and package
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          mkdir out
          apk=build/app/outputs/flutter-apk/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > out/ANDROID-SIGNATURE.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/apk-badging.txt"
          grep "package: name='com.karsift.hiddify'" "$RUNNER_TEMP/apk-badging.txt"
          cp "$apk" "out/Hiddify-Karsift-$version-Android-universal.apk"
          cd out
          sha256sum *.apk > SHA256SUMS-Android.txt
          printf 'Source commit: %s\nNative core SHA256: 2a18ad4d9781e61901d5fb1c1edca28b8abadb9b36184055fed37091f97bc769\n' "$GITHUB_SHA" > BUILD-INFO-Android.txt
      - uses: actions/upload-artifact@v6
        with:
          name: android-installable
          path: out/*
          retention-days: 14

  apple:
    needs: test
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [macos, ios]
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: '3.38.5'
          cache: true
      - name: Download verified Apple core
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          if [ "$PLATFORM" = macos ]; then
            digest=6d28855732f8a2d8f1f65193204c632b9cfe38aaa2bbc6951d5bddfea5d0e06a
            destination=hiddify-core/bin
          else
            digest=fb3d24c7c7310ceeff08280b44d6ae5ae66c1185093297854f0361cb16e927cf
            destination=ios/Frameworks
          fi
          archive="$RUNNER_TEMP/apple-core.tar.gz"
          curl --fail --location --retry 3 "https://github.com/hiddify/hiddify-core/releases/download/v5.0.3/hiddify-lib-$PLATFORM.tar.gz" -o "$archive"
          echo "$digest  $archive" | shasum -a 256 --check
          mkdir -p "$destination"
          tar -xzf "$archive" -C "$destination"
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart run slang
      - name: Build macOS application
        if: matrix.platform == 'macos'
        run: flutter build macos --release --target lib/main_prod.dart
      - name: Build iOS application for later signing
        if: matrix.platform == 'ios'
        run: flutter build ios --release --no-codesign --target lib/main_prod.dart --verbose
      - name: Package Apple build
        env:
          PLATFORM: ${{ matrix.platform }}
        run: bash scripts/package_apple.sh "$PLATFORM"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.platform }}-package
          path: out/*
          retention-days: 14

  release:
    if: always() && needs.windows.result == 'success' && needs.apple.result == 'success' && (needs.android.result == 'success' || (needs.android.result == 'skipped' && inputs.reuse-android-run != '')) && (startsWith(github.ref, 'refs/tags/') || inputs.release-tag != '')
    needs: [windows, android, apple]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          name: windows-installable
          path: out
      - uses: actions/download-artifact@v7
        with:
          name: android-installable
          run-id: ${{ inputs.reuse-android-run || github.run_id }}
          github-token: ${{ github.token }}
          path: out
      - uses: actions/download-artifact@v7
        with:
          pattern: '*-package'
          merge-multiple: true
          path: out
      - name: Verify reused APK source compatibility
        if: inputs.reuse-android-run != ''
        run: |
          source=$(sed -n 's/^Source commit: //p' out/BUILD-INFO-Android.txt)
          [[ "$source" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git diff --exit-code "$source" "$GITHUB_SHA" -- . ':!windows/**' ':!.github/**'
      - uses: softprops/action-gh-release@v2
        with:
          name: Hiddify Karšift ${{ inputs.release-tag || github.ref_name }} — macOS, Windows, Android and iOS
          tag_name: ${{ inputs.release-tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: out/*
          fail_on_unmatched_files: true
          body: |
            macOS, Windows 11 x64, Android and unsigned iOS test release with Lowest latency and Balance across all saved subscriptions.

            Windows: run the Setup.exe for a per-user installation, or extract the portable ZIP. Both store data beside the executable in hiddify_portable_data. The Windows binaries are unsigned. The installer uses a separate Karšift folder and retains profile data on uninstall.

            macOS: open the DMG and copy Hiddify Karsift to Applications. This test build is ad-hoc signed and is not notarized by Apple.

            iOS: the unsigned IPA is for later signing, not direct installation. See IOS-SIGNING.txt for the required app and VPN-extension provisioning.

            Android: install the signed universal APK. Its separate com.karsift.hiddify package can coexist with official Hiddify. Future Karšift APK updates use the same signing key. Device VPN permission must be granted by the owner.

            Import two subscriptions, select either All subscriptions entry from the home profile picker, then connect. Test normal traffic, source updates, restart persistence and switching back to a regular subscription. Only one Hiddify instance should run during testing. Avoid upstream update prompts while testing this fork.
